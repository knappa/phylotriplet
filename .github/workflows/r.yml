# See https://github.com/r-lib/actions/tree/master/examples#readme for
# additional example workflows available for the R community.

name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        r-version: ['release']

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen3
        run: brew install eigen

      - name: Set Eigen3 include path
        run: echo "EIGEN3_INCLUDE_DIR=$(brew --prefix eigen)/include/eigen3" >> $GITHUB_ENV

      - name: Copy C++ headers into R package
        run: |
          mkdir -p R/inst/include
          cp -r include/phylotriplet R/inst/include/

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "Rcpp"))
          remotes::install_deps("R", dependencies = TRUE)
        shell: Rscript {0}

      - name: Generate Rcpp exports
        run: Rcpp::compileAttributes("R")
        shell: Rscript {0}

      - name: Check
        run: rcmdcheck::rcmdcheck("R", args = "--no-manual", error_on = "error")
        shell: Rscript {0}