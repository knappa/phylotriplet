[build-system]
requires = ["setuptools>=42", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phylotriplet"
version = "0.1.0"
description = "Phylogenetic tree inference from weighted input trees"
readme = "README.md"
authors = [
    {name = "Adam C Knapp", email = "adam.knapp@medicine.ufl.edu"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.7"

[project.optional-dependencies]
dev = ["pytest>=6.0", "ete3"]

[project.urls]
Homepage = "https://github.com/knappa/phylotriplet"
"Bug Reports" = "https://github.com/knappa/phylotriplet/issues"